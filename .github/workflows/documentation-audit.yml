name: Documentation verification
on:
  push:
    branches: [docs/public-research]
permissions:
  contents: write
concurrency:
  group: public-documentation-update
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/docs/public-research'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Remove obsolete operational reminders from documentation
        shell: python
        run: |
          import hashlib, json, pathlib, re, subprocess
          root = pathlib.Path.cwd()
          baseline = '1a3c2cd5343eeb27b9d598601d44c1f704eecb19'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          english = [
              r'Do not spawn subagents unless (?:the user explicitly asks|explicitly requested)\.',
              r'Do not start sub-agents or delegated reviews unless (?:the user explicitly asks|explicitly asked)\.',
              r'Local Python drawing (?:remains|is) authorised\.',
              r'Local Python plotting is authorised; historical (?:web-only figure instructions|Web-GPT-only contracts) are superseded\.',
              r'No automatic sub-agent review\.',
              r'No subagents were used\.',
          ]
          chinese = re.compile(r'(?:本轮|本次)?(?:没有|未|不)(?:启动|调用)子智能体[。；，,;.]?')
          changed_notes = []
          for name in tracked:
              if not name.endswith('.md') or not name.startswith(('docs/', 'manuscript/revisions/', 'manuscript/results-evidence-allocation')):
                  continue
              if '/before/' in name:
                  continue
              path = root / name
              old = path.read_text(encoding='utf-8')
              new = old
              for pattern in english:
                  new = re.sub(pattern, '', new)
              new = chinese.sub('', new)
              if new != old:
                  new = re.sub(r'(?m)^[ \t]+$', '', new)
                  new = re.sub(r'\n{3,}', '\n\n', new)
                  path.write_text(new, encoding='utf-8', newline='\n')
                  changed_notes.append(name)
          replacements = {
              'tools/aidr.py': {
                  'Common paper-editing and verification tasks; no third-party imports required.': 'Reproduction and verification commands for AIDRBench.',
                  'Required editing files:': 'Required resource files:',
                  'Figure editing': 'Figure reproduction',
                  'ZIP editing works': 'ZIP supports figure reproduction',
              },
              'tests/test_user_tools.py': {
                  'Regression checks for the public editing entry points and documentation.': 'Regression checks for reproduction commands and documentation.',
              },
          }
          for name, pairs in replacements.items():
              path = root / name
              text = path.read_text(encoding='utf-8')
              for old, new in pairs.items():
                  assert old in text, (name, old)
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8', newline='\n')
          layout_path = root / 'docs/checkout-layout.json'
          layout = json.loads(layout_path.read_text(encoding='utf-8'))
          changed = subprocess.check_output(['git', 'diff', '--name-only', baseline, '--']).decode().splitlines()
          for name in changed:
              if name == 'docs/checkout-layout.json' or name.startswith('.github/workflows/'):
                  continue
              data = (root / name).read_bytes()
              layout['updated_git_blobs'][name] = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          layout_path.write_text(json.dumps(layout, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          protected_prefixes = ('src/', 'configs/', 'data/', 'manuscript/source_data/', 'manuscript/releases/')
          protected_suffixes = ('.csv', '.xlsx', '.parquet', '.npz', '.pdf', '.tex', '.png', '.webp', '.svg', '.pptx')
          protected_names = {'manuscript/nature_communications_article.md', 'manuscript/supplementary_information.md'}
          for name in changed:
              assert not name.startswith(protected_prefixes), name
              assert not name.endswith(protected_suffixes), name
              assert name not in protected_names, name
          print('Scientific implementation, configurations, data, manuscript and figure files unchanged.')
          print('Operational-note changes:')
          print('\n'.join(changed_notes))
          print('Maintained file hashes:')
          print(json.dumps({name: layout['updated_git_blobs'][name] for name in changed if name in layout['updated_git_blobs']}, indent=2))
      - name: Install test and reproduction dependencies
        run: python -m pip install -c requirements-certificate.txt -e ".[control,analysis,dev,paper]"
      - name: Lint
        run: python -m ruff check src tests scripts/check_v027_checkout.py scripts/rebuild_main_figures.py tools/aidr.py
      - name: Type check
        run: python -m mypy src
      - name: Test
        run: python -m pytest -q
      - name: Verify files and hashes
        run: python tools/aidr.py check --hashes
      - name: Verify figure series
        run: |
          python paper/v0.27/figures/supplement/DRAW_SUPPLEMENT.py --audit
          python paper/v0.27/figures/supplement/audit/verify_panels.py --captured paper/v0.27/figures/supplement/MY_REDRAW/captured --report paper/v0.27/figures/supplement/MY_REDRAW/verification.json
      - name: Finalize documentation branch
        env:
          EXPECTED_REF: refs/heads/docs/public-research
        run: |
          test "$GITHUB_REF" = "$EXPECTED_REF"
          git rm .github/workflows/documentation-audit.yml
          git add -u
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Verify public documentation and update file manifests"
          git push origin HEAD:refs/heads/docs/public-research
