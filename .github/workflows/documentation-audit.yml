name: Documentation audit
on:
  push:
    branches: [docs/public-research]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Inspect repository documentation
        shell: python
        run: |
          import pathlib, re, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          pattern = re.compile(r'chatgpt|codex|openai|claude|sub.?agents?|as an ai|ai.generated|generated by|at the author.s request|unless explicitly requested|do not spawn|local python drawing|edit (?:the |your )?manuscript|edit (?:the |your )?paper|author.{0,24}(?:pending|confirm)|交付|合作者|智能体|用户要求|按照.*要求', re.I)
          extensions = {'.md', '.rst', '.txt', '.py', '.tex', '.yml', '.yaml', '.json', '.toml'}
          count = 0
          for name in paths:
              p = pathlib.Path(name)
              if not p.is_file() or p.suffix.lower() not in extensions or p.stat().st_size > 2000000:
                  continue
              for number, line in enumerate(p.read_text(encoding='utf-8', errors='replace').splitlines(), 1):
                  if pattern.search(line):
                      count += 1
                      if count <= 250:
                          print(f'MATCH {name}:{number}: {line[:350]}')
          print(f'TOTAL_MATCHES {count}')
          print('DOCUMENTATION_FILES')
          for name in paths:
              if name.endswith(('.md', '.rst')):
                  print(name)
