name: CI

on:
  push:
    branches: [main, codex/manuscript-v027]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  MPLBACKEND: Agg

jobs:
  code-and-paper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and editing dependencies
        run: python -m pip install -c requirements-certificate.txt -e ".[control,analysis,dev,paper]"
      - name: Lint
        run: python -m ruff check src tests scripts/check_v027_checkout.py scripts/rebuild_main_figures.py
      - name: Type check
        run: python -m mypy src
      - name: Test
        run: python -m pytest -q
      - name: Verify paper files and Windows paths
        run: python scripts/check_v027_checkout.py --hashes
      - name: Redraw supplementary figures from CSV
        run: python paper/v0.27/figures/supplement/DRAW_SUPPLEMENT.py --audit
      - name: Verify all redrawn quantitative series
        run: python paper/v0.27/figures/supplement/audit/verify_panels.py --captured paper/v0.27/figures/supplement/MY_REDRAW/captured --report paper/v0.27/figures/supplement/MY_REDRAW/verification.json
      - name: Rebuild main panels and PowerPoint
        run: python scripts/rebuild_main_figures.py --panels-only
      - name: Render Markdown review copies
        run: |
          python scripts/render_review_tex.py
          python scripts/render_supplementary_tex.py
