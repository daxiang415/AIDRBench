name: Optional RL CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "src/aidrbench/training.py"
      - "src/aidrbench/controllers/hourly_sb3.py"
      - "src/aidrbench/rewards/**"
      - "configs/algorithms/**"
      - "tests/test_training.py"
      - "tests/test_cmdp_reward.py"
      - "pyproject.toml"
      - ".github/workflows/rl-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rl-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional RL extension
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[control,rl,analysis,dev]"
      - name: Test RL extension
        run: pytest tests/test_training.py tests/test_cmdp_reward.py
