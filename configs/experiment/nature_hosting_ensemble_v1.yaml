schema_version: 1
model_a_git_commit: d03b44090b2c7ca6a5ae73bb2eb7a611f36a71e9
dataset_role: development_hosting_capacity
independent_unit: frozen_scenario
expected_scenario_count: 100
expected_episode_seed_range: [10000, 10099]

portfolio:
  path: configs/community/pv_bess.yaml
  sha256: e4bc9dead9494906e3ab042cf2b653022e1e73e97e04468831ee273000d56d04

solver:
  name: HIGHS
  threads_per_process: 1

capacity_aggregation:
  headline: simultaneous_scenario_feasible_minimum
  descriptive_quantiles: [0.05, 0.50, 0.95]

paired_inference:
  estimand: mean_within_scenario_contrast_kw
  confidence_level: 0.95
  familywise_method: bonferroni
  planned_contrast_count: 8
  bootstrap_resamples: 10000
  bootstrap_seed: 260819

# A practical-equivalence threshold fixed before the ensemble run. It equals
# 5% of the calibrated reference-mix operating peak (about 10 kW here).
interaction_equivalence_margin:
  basis: fraction_of_reference_mix_operating_peak
  fraction: 0.05
