  # External observations anchor selected sensitivity ranges but are not copied
  # into the model as point estimates unless the permitted-use field says so.
  # The whole rectangular evidence register is exported so every citation and
  # interpretation boundary remains inspectable outside the repository.
  - table_id: fig6_external_parameter_evidence
    figures: [6]
    panels: [supporting]
    output: fig6_external_parameter_evidence.csv
    inputs:
      - path: data/economics/external_parameter_evidence.csv
    columns:
      - evidence_id
      - input_id
      - parameter_family
      - source_title
      - source_organization
      - source_url
      - publication_or_reporting_year
      - access_date
      - observed_value
      - unit
      - currency_year
      - support_level
      - replaceability
      - permitted_use
      - forbidden_interpretation
    sort_by: [input_id, evidence_id]

