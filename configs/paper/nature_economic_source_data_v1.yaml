      - variable_enablement_cost
      - enablement_cost
      - fixed_site_enablement_cost_per_offer_kw
      - annual_net_value
      - annual_net_value_excluding_fixed_site
      - annual_net_value_p05
      - annual_net_value_excluding_fixed_site_p05
