# LOCKED OOD Nature Communications scenarios. Do not generate or inspect before freeze.
seed: 2026
scenario:
  locked_ood: true
  preregistration_manifest: data/manifests/nature_mainline_protocol_v1.yaml
env:
  timestep_hours: 1.0
  episode_days: 7
  clearance_tail_hours: 48
  forecast_horizon_hours: 6
  action_mode: continuous
  episode_seed_range: [30000, 30499]
community:
  source: nrel_eulp
  path: data/processed/community_load.parquet
  profile_id: eulp_mixed_3c
  background_peak_kw: 800
  pcc_capacity_kw: 1000
  pv_enabled: true
virtual_datacenter:
  gpus_per_node: 4
  # Fixed from the nominal reference sizing; never resize across power cases.
  node_count: 144
  target_dc_peak_share_of_pcc: 0.20
  flexible_gpu_fraction: 0.60
  pue: 1.20
workload:
  source: alibaba2026_lite
  summary_path: data/processed/jobs_summary_sampler.parquet
  arrival_process: block
  target_total_utilization: 0.65
  flexible_priorities: [LP]
  max_deadline_hours: 48
  deadline_buckets: [0, 1, 2, 3, 6, 12, 24, 48]
  workload_mix:
    shares: {training: 0.50, offline_inference: 0.50}
    flexible_fractions: {training: 1.00, offline_inference: 0.50}
  deadline_policy:
    training:
      slack_multiplier_range: [2.0, 6.0]
      minimum_slack_h: 6
      maximum_slack_h: 48
    offline_inference:
      slack_multiplier_range: [1.5, 4.0]
      minimum_slack_h: 2
      maximum_slack_h: 24
hardware:
  calibration_artifact: data/calibration/rtx6000pro_4gpu_v1.yaml
  require_calibration_artifact: true
  require_all_workload_class_power: true
  calibration_power_case: nominal
dr:
  mode: capacity_limit
  source: configured
  event_start_hours: [72]
  event_duration_hours: 1
  event_notice_hours: 0
  reduction_fraction: 0.20
  recovery_window_hours: 24
  recovery_backlog_tolerance_fraction: 0.02
  event_start_jitter_hours: 0
reward:
  version: firm_threshold_v2
  min_delivery_ratio: 0.95
  max_deadline_miss_rate: 0.01
  max_rebound_ratio: 0.25
  min_window_peak_relief_fraction: 0.50
  max_terminal_backlog_fraction: 0.02
  delivery_violation_weight: 1.0
  feasibility_violation_weight: 1.0
  deadline_violation_weight: 1.0
  rebound_violation_weight: 1.0
  window_violation_weight: 1.0
  terminal_violation_weight: 1.0
  excess_backlog_weight: 0.05
  switching_weight: 0.001
