algorithm: dqn
environment_config: configs/env/hourly_formal_train_discrete.yaml
total_timesteps: 10000
checkpoint_interval: 5000
n_envs: 1
policy: MlpPolicy
reward_adapter:
  version: firm_cmdp_v4
  useful_compute_weight: 1.0
  potential_shaping_weight: 0.25
  switching_weight: 0.001
  dual_learning_rate: 0.005
  dual_tolerance: 0.01
  initial_multiplier: 1.0
  maximum_multiplier: 20.0
  cost_clip: 10.0
hyperparameters:
  learning_rate: 0.0001
  buffer_size: 50000
  learning_starts: 1000
  batch_size: 128
  gamma: 0.995
  train_freq: 4
