schema_version: 1
protocol_id: aidrbench_nature_communications_mainline_v1
study_type: nature_communications_mechanism_mainline
status: preregistration_draft
locked_ood_status: not_run

scientific_estimand:
  primary: duration_notice_reliability_firm_flexibility_surface
  capacity_layers: [nominal, perfect_information, non_anticipative]
  controller_training_required: false

data:
  community:
    path: data/processed/community_load.parquet
    sha256: daa513e8a6597232c47c5c0554fcf6723e59e785c3fe3c85c058ae54c6f235f0
  workload_sampler:
    path: data/processed/jobs_summary_sampler.parquet
    sha256: 67e5cc0878e246e9de547cc838c6b0e3df5a25fcd52f043624235873ca2a0d66
  hardware_calibration:
    path: data/calibration/rtx6000pro_4gpu_v1.yaml
    sha256: 7d4756057f539a242c513d8e83c32c86cd3b83b2b561709f3fa8090820c37de0
    artifact_sha256: 6f6c5aa776c90be6f8d1f1d41ee2457b321558257aed363ebe2cbd063433c996
    evidence_class: benchmark_anchored_synthetic

scenario_sets:
  development:
    role: model_and_experiment_development
    config: configs/env/nature_mainline_development.yaml
    episode_seed_range: [10000, 10099]
    independent_episode_count: 100
    locked: false
  validation:
    role: numerical_stability_and_preregistered_analysis_check
    config: configs/env/nature_mainline_validation.yaml
    episode_seed_range: [20000, 20099]
    independent_episode_count: 100
    locked: false
  locked_ood:
    role: final_robustness_and_extrapolation
    config: configs/env/nature_mainline_locked_ood.yaml
    episode_seed_range: [30000, 30499]
    independent_episode_count: 500
    locked: true

primary_single_event:
  statistical_unit: independent_episode
  events_per_episode: 1
  event_start_hour: 72
  duration_hours: [1, 2, 3, 4, 6, 8]
  notice_hours: [0, 2, 6]
  reliability_targets: [0.90, 0.95, 0.99]
  confidence_level: 0.95
  confidence_method: one_sided_wilson_lower_bound
  nominal_flexibility_fraction_of_reference_mix_peak: 0.50
  success_criteria:
    min_delivery_ratio: 0.95
    min_interval_delivery_ratio: 0.95
    max_deadline_miss_rate: 0.01
    max_rebound_ratio: 0.25
    min_window_peak_relief_fraction: 0.50
    max_terminal_backlog_fraction: 0.02

repeated_event_exhaustion:
  separate_from_primary_surface: true
  statistical_unit: joint_episode
  event_counts: [1, 2, 3, 4]
  recovery_gaps_hours: [2, 4, 8, 12, 24]
  metrics: [compute_debt_kwh, residual_flexibility_ratio, rebound_ratio]

hosting_capacity:
  optimization_layer: perfect_information_planning_bound
  portfolio_matrix:
    dc_operation: [rigid, flexible]
    pv: [false, true]
    bess: [false, true]
  capacity_normalization: reference_mix_operating_peak
  also_report: [worst_class_peak, absolute_kw, hosting_gain_kw, hosting_multiplier]

uncertainty:
  calibration_power_cases: [lower_ci, nominal, upper_ci]
  workload_sensitivities: [utilization, deadline, training_offline_mix, burstiness]
  infrastructure_sensitivities: [pue, node_overhead]

optional_control_extension:
  enabled_in_mainline: false
  permitted_after_main_results: [rule_based, mpc]
  reinforcement_learning_required: false
