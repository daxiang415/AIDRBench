scenario_sets:
  development:
    role: model_and_experiment_development
    config: configs/env/nature_mainline_development.yaml
    episode_seed_range: [10000, 10099]
    independent_episode_count: 100
    locked: false
  validation:
    role: numerical_stability_and_preregistered_analysis_check
    config: configs/env/nature_mainline_validation.yaml
    episode_seed_range: [20000, 20099]
    independent_episode_count: 100
    locked: false
  locked_id:
    role: final_in_distribution_reliability_certificate
    config: configs/env/nature_mainline_locked_id.yaml
    episode_seed_range: [30000, 30499]
    independent_episode_count: 500
    locked: true
  locked_ood:
    role: final_robustness_and_extrapolation
    config: configs/env/nature_mainline_locked_ood.yaml
    episode_seed_range: [40000, 40499]
    independent_episode_count: 500
    locked: true

primary_single_event:
  statistical_unit: independent_episode
  events_per_episode: 1
  event_start_policy:
    type: random_from_declared_peak_window
    candidate_hours: [63, 64, 65, 66, 67, 68, 87, 88, 89, 90, 91, 92, 111, 112, 113, 114, 115, 116, 135, 136, 137, 138, 139, 140]
    local_clock_hours: [15, 16, 17, 18, 19, 20]
    episode_days: [3, 4, 5, 6]
    sampling: uniform_one_start_per_episode_from_independent_event_rng
  duration_hours: [1, 2, 3, 4, 6, 8]
  notice_hours: [0, 2, 6]
  reliability_targets: [0.90, 0.95, 0.99]
  confidence_level: 0.95
  pi_confidence_method: exact_binomial_nonparametric_lower_tolerance_bound
  fixed_candidate_confidence_method: one_sided_wilson_lower_bound
  non_anticipative_interpretation: restricted_scenario_based_causal_bound
  non_anticipative_statistical_unit: independent_frozen_episode
  non_anticipative_confidence_bound: none_same_ensemble_selection
  non_anticipative_information_gap_reference: matched_same_ensemble_empirical_pi_order_statistic
  nominal_flexibility_fraction_of_reference_mix_peak: 0.50
  success_criteria:
    min_delivery_ratio: 0.95
    min_interval_delivery_ratio: 0.95
    max_deadline_miss_rate: 0.01
    max_rebound_ratio: 0.25
    min_window_peak_relief_fraction: 0.50
    max_terminal_backlog_fraction: 0.02
  criteria_interpretation: preregistered_operational_definition_not_fitted_reward
  criteria_sensitivity:
    min_delivery_ratio: [0.90, 0.95, 0.98]
    max_rebound_ratio: [0.10, 0.25, 0.50]
    min_window_peak_relief_fraction: [0.25, 0.50, 0.75]
    max_deadline_miss_rate: [0.00, 0.01, 0.02]

causal_certificate:
  role: independently_tested_operational_realization
  policy: robust_mpc
  controller_specification:
    path: configs/controller/nature_robust_mpc_v1.yaml
    sha256: 73041f55b7ac4aab0a1f6fa799cfa94f0a8c71d6e6bb3a7f39eadda212839dcf
  policy_frozen_before_locked_id: true
  capacity_selected_on: validation
  capacity_evaluated_once_on: locked_id
  confidence_method: one_sided_wilson_lower_bound
  headline_reliability_target: 0.95
  secondary_reliability_targets: [0.90, 0.99]
  intervalwise_confidence_only: true
  simultaneous_surface_confidence_claimed: false
  selection_search:
    method: binary
    candidate_fraction_bounds: [0.0, 1.0]
    binary_iterations: 10
    durations_h: [1, 2, 3, 4, 6, 8]
    notices_h: [0, 2, 6]
    scenario_workers: 16
  failure_taxonomy:
    - mean_delivery
    - interval_delivery
    - deadline_miss
    - rebound
    - window_peak_relief
    - terminal_backlog
  output_schema:
    validation_selection:
      - causal_selection.json
      - validation_candidate_diagnostics.parquet
    locked_certificate:
      - causal_certificate.json
      - causal_certificates.parquet
      - causal_certificate_outcomes.parquet
    headline_fields:
      - duration_h
      - notice_h
      - reliability_target
      - candidate_reduction_kw
      - success_count
      - trial_count
      - empirical_success_fraction
      - wilson_lower_confidence_bound
      - certified
    outcome_failure_field: failure_reasons
  interpretation: deployable_reference_not_controller_comparison

